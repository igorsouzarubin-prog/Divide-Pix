<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Divida despesas em grupo e gere um resumo para Pix." />
    <title>Divide Pix — rache contas sem planilha</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <section class="intro">
        <p class="eyebrow">GRÁTIS · OFFLINE · SEM CADASTRO</p>
        <h1>Divide Pix</h1>
        <p>Rache uma despesa, considere quem já pagou e compartilhe o resumo.</p>
      </section>

      <section class="card" aria-labelledby="despesa-titulo">
        <h2 id="despesa-titulo">A despesa</h2>
        <label for="descricao">Descrição <span>(opcional)</span></label>
        <input id="descricao" type="text" placeholder="Ex.: jantar de sexta" maxlength="80" />
        <label for="total">Valor total (R$)</label>
        <input id="total" inputmode="decimal" type="text" placeholder="0,00" aria-describedby="ajuda-total" />
        <p id="ajuda-total" class="hint">Use vírgula ou ponto para os centavos.</p>
      </section>

      <section class="card" aria-labelledby="pessoas-titulo">
        <div class="section-heading">
          <h2 id="pessoas-titulo">Pessoas</h2>
          <button id="adicionar" class="secondary" type="button">+ Adicionar pessoa</button>
        </div>
        <div id="pessoas" aria-live="polite"></div>
      </section>

      <section class="result card" aria-labelledby="resultado-titulo">
        <h2 id="resultado-titulo">Resumo</h2>
        <p id="aviso" class="hint">Adicione o valor e pelo menos uma pessoa.</p>
        <div id="resumo"></div>
        <button id="copiar" type="button" disabled>Copiar resumo para WhatsApp</button>
      </section>
    </main>
    <template id="pessoa-template">
      <div class="pessoa">
        <input class="nome" type="text" placeholder="Nome" maxlength="40" aria-label="Nome da pessoa" />
        <div>
          <label class="inline-label">Já pagou (R$)
            <input class="pago" type="text" inputmode="decimal" placeholder="0,00" aria-label="Valor já pago" />
          </label>
        </div>
        <button class="remover" type="button" aria-label="Remover pessoa">×</button>
      </div>
    </template>
    <script src="app.js"></script>
  </body>
</html>
